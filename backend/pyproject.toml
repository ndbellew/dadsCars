[project]
name = "dadscars-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["Flask==3.1.3", "Flask-SQLAlchemy==3.1.1", "Flask-Migrate==4.0.7", "SQLAlchemy==2.0.36", "psycopg[binary]==3.2.3"]
[project.optional-dependencies]
dev = ["pytest==8.3.4", "pytest-cov==6.0.0", "ruff==0.8.4", "mypy==1.13.0", "bandit==1.8.0", "pip-audit==2.7.3"]
[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disable_error_code = ["import-untyped", "name-defined"]
