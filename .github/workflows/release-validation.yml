name: Release validation
on:
  push:
    tags: ["v*.*.*"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate semantic version tag and manifests
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          node -e 'const fs=require("fs"); const versions=[require("./mobile/package.json").version, JSON.parse(fs.readFileSync("mobile/app.json","utf8")).expo.version]; if(versions.some(v=>v!==process.argv[1])) { console.error(`Version mismatch: ${versions.join(", ")} != ${process.argv[1]}`); process.exit(1); }' "$TAG_VERSION"
          echo "Release tag validated; no publishing or deployment performed."
