name: Mobile CI
on:
  push: {branches: [development, main]}
  pull_request: {branches: [development, main]}
jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: mobile}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json}
      - run: npm ci
      - run: npm run lint && npm run format:check && npm run typecheck && npm test -- --runInBand
      - run: npx expo install --check
      - name: Dependency security audit
        run: node scripts/check-audit.mjs
